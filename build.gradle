plugins {
    id 'java-library'
    id 'idea'
    // ModDevGradle : plugin officiel NeoForge pour 1.21.x
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'fr.citizen.fonderie'

base {
    archivesName = 'citizenfonderie'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // => net.neoforged:neoforge:21.1.215 (Minecraft 1.21.1)
    version = '21.1.215'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        citizenfonderie {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
